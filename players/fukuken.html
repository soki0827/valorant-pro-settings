<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>fukukeN 感度・DPI・eDPI・マウス設定 | NIKOPROSETTEI</title>

  <meta
    name="description"
    content="fukukeN選手のVALORANT感度、DPI、eDPI、マウス、マウスパッドなどの設定情報を掲載しています。"

  <style>

    body {
      margin: 0;
      padding: 40px 20px;
      background: #0b0d12;
      color: white;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: #151922;
      border: 1px solid #2a3040;
      border-radius: 16px;
      padding: 30px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .team {
      color: #999;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .item {
      background: #0f1219;
      padding: 20px;
      border-radius: 10px;
    }

    .label {
      display: block;
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
    }

    a {
      color: white;
    }

    .amazon {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 15px;
      background: #ff9900;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #aaa;
      text-decoration: none;
    }

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <div class="card">

      <h1>🇯🇵 fukukeN</h1>

      <div class="team">
        Delight
      </div>


      <div class="grid">


        <div class="item">

          <span class="label">
            ROLE
          </span>

          <span class="value">
            未登録
          </span>

        </div>


        <div class="item">

          <span class="label">
            DPI
          </span>

          <span class="value">
            未登録
          </span>

        </div>


        <div class="item">

          <span class="label">
            SENSITIVITY
          </span>

          <span class="value">
            未登録
          </span>

        </div>


        <div class="item">

          <span class="label">
            eDPI
          </span>

          <span class="value">
            未登録
          </span>

        </div>


        <div class="item">

          <span class="label">
            MOUSE

          <span class="value">
            未登録
          </span>

        </div>


        <div class="item">

          <span class="label">

          </span>

          <span class="value">
            未登録
          </span>

        </div>


      </div>


      <a
