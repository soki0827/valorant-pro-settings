```html
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="google-site-verification"
    content="V5oojDNGcRwzI8Rn1DCLUJqRLTM4F4fBTgIdTE9JxsI"
  >

  <title>VALORANT Pro Settings</title>

  <meta
    name="description"
    content="VALORANTプロ選手の感度、DPI、eDPI、マウス、マウスパッドなどの設定を検索できます。"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="header-inner">

      <div class="logo">
        VALORANT
        <span>PRO SETTINGS</span>
      </div>

      <p class="subtitle">
        プロ選手の感度・DPI・デバイス情報を検索
      </p>

    </div>

  </header>


  <main class="container">


    <!-- 検索・フィルター -->

    <section class="filter-section">

      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder="選手名・チーム名で検索..."
          autocomplete="off"
        >

      </div>


      <div class="filters">

        <select id="regionFilter">
          <option value="all">地域：すべて</option>
          <option value="Pacific">Pacific</option>
          <option value="Americas">Americas</option>
          <option value="EMEA">EMEA</option>
        </select>


        <select id="countryFilter">
          <option value="all">国籍：すべて</option>
          <option value="Japan">Japan</option>
          <option value="South Korea">South Korea</option>
          <option value="Canada">Canada</option>
          <option value="Russia">Russia</option>
        </select>


        <select id="roleFilter">
          <option value="all">ROLE：すべて</option>
          <option value="Duelist">Duelist</option>
          <option value="Controller">Controller</option>
          <option value="Initiator">Initiator</option>
          <option value="Sentinel">Sentinel</option>
          <option value="Flex">Flex</option>
          <option value="未登録">未登録</option>
        </select>


        <select id="edpiFilter">
          <option value="all">eDPI：すべて</option>
          <option value="low">100 - 199</option>
          <option value="mid">200 - 299</option>
          <option value="high">300 - 399</option>
          <option value="veryhigh">400+</option>
        </select>


        <select id="sensFilter">
          <option value="all">感度：すべて</option>
          <option value="low">0.10 - 0.19</option>
          <option value="mid">0.20 - 0.29</option>
          <option value="high">0.30 - 0.39</option>
          <option value="veryhigh">0.40+</option>
        </select>

      </div>

    </section>


    <!-- 選手一覧 -->

    <section>

      <div class="list-header">

        <div>
          <h1>プロ選手一覧</h1>

          <p>
            感度・DPI・eDPI・デバイスを確認できます
          </p>
        </div>

        <div
          id="resultCount"
          class="result-count"
        >
          0人
        </div>

      </div>


      <div
        id="playerList"
        class="player-list"
      >
      </div>


      <!-- 選手詳細 -->

      <div
        id="playerDetail"
        class="player-detail hidden"
      >
      </div>

    </section>


    <!-- eDPI計算機 -->

    <section class="calculator">

      <h2>eDPI計算機</h2>

      <p>
        DPIとゲーム内感度を入力するとeDPIを計算します。
      </p>


      <div class="calculator-inputs">

        <input
          type="number"
          id="dpiInput"
          placeholder="DPI"
          min="1"
        >

        <span>×</span>

        <input
          type="number"
          id="sensInput"
          placeholder="感度"
          min="0"
          step="0.001"
        >

        <button
          type="button"
          onclick="calculateEDPI()"
        >
          計算
        </button>

      </div>


      <div class="calculator-result">

        eDPI

        <strong id="edpiResult">
          0.0
        </strong>

      </div>

    </section>

  </main>


  <footer>

    <p>
      VALORANT Pro Settings
    </p>

    <p class="footer-sub">
      ※掲載情報は変更される場合があります。
    </p>

  </footer>


  <script src="script.js"></script>

</body>

</html>
```
