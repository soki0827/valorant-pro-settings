<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALORANT Pro Settings</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>VALORANT Pro Settings</h1>

<p>
VALORANTプロ選手の感度・デバイス設定一覧
</p>

</header>



<main>


<section class="search-area">


<input
id="searchInput"
type="text"
placeholder="選手名・チーム名検索"
/>



<select id="regionFilter">

<option value="all">
全地域
</option>

<option value="Pacific">
Pacific
</option>

<option value="Americas">
Americas
</option>

<option value="EMEA">
EMEA
</option>

<option value="China">
China
</option>

</select>



<select id="countryFilter">

<option value="all">
全ての国
</option>

<option value="Japan">
日本
</option>

<option value="South Korea">
韓国
</option>

<option value="Canada">
カナダ
</option>

<option value="Russia">
ロシア
</option>

</select>



<select id="roleFilter">

<option value="all">
全ロール
</option>

<option value="Duelist">
Duelist
</option>

<option value="Controller">
Controller
</option>

<option value="Initiator">
Initiator
</option>

<option value="Sentinel">
Sentinel
</option>

<option value="Flex">
Flex
</option>

</select>



<select id="edpiFilter">

<option value="all">
全eDPI
</option>

<option value="low">
100〜200
</option>

<option value="mid">
200〜300
</option>

<option value="high">
300〜400
</option>

<option value="veryhigh">
400以上
</option>

</select>


<select id="sensFilter">

<option value="all">
全感度
</option>

<option value="low">
0.10〜0.20
</option>

<option value="mid">
0.20〜0.30
</option>

<option value="high">
0.30〜0.40
</option>

<option value="veryhigh">
0.40以上
</option>

</select>


</section>




<div class="count">

現在
<span id="resultCount">
0人
</span>

</div>




<section
id="playerList"
class="player-list"
>
</section>



<section
id="playerDetail"
class="hidden"
>
</section>



<section class="edpi-calculator">


<h2>
eDPI計算機
</h2>


<input
id="dpiInput"
type="number"
placeholder="DPI"
/>


<input
id="sensInput"
type="number"
step="0.001"
placeholder="Sensitivity"
/>


<button onclick="calculateEDPI()">
計算
</button>


<p>

eDPI :

<span id="edpiResult">
0
</span>

</p>


</section>



</main>




<footer>


<a href="privacy.html">
プライバシーポリシー
</a>


<a href="contact.html">
お問い合わせ
</a>


<p>
© VALORANT Pro Settings
</p>


</footer>




<script src="script.js"></script>


</body>

</html>
