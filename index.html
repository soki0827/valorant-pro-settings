<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALO SENS | VALORANT プロ感度検索</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>VALO <span>SENS</span></h1>

<nav>
<a>ホーム</a>
<a>プロ検索</a>
<a>計算機</a>
<a>比較</a>
</nav>

</header>


<section class="hero">

<h2>VALORANT プロ設定を探す</h2>

<p>
プロの感度・eDPI・デバイス設定を検索
</p>


<input 
id="search"
type="text"
placeholder="選手名・チーム名で検索">


</section>



<section class="filters">


<select id="region">

<option value="">地域</option>
<option value="Japan">日本</option>
<option value="Korea">韓国</option>
<option value="Pacific">太平洋</option>
<option value="Americas">北米</option>

</select>


<select id="role">

<option value="">ロール</option>
<option value="Duelist">Duelist</option>
<option value="Sentinel">Sentinel</option>
<option value="Controller">Controller</option>
<option value="Initiator">Initiator</option>

</select>


<input 
id="dpi"
type="number"
placeholder="DPI以上">


<input 
id="edpi"
type="number"
placeholder="eDPI以上">


<select id="sort">

<option value="">並び替え</option>
<option value="low">eDPI低い順</option>
<option value="high">eDPI高い順</option>

</select>


</section>



<main id="players"></main>



<script src="script.js"></script>

</body>
</html>
