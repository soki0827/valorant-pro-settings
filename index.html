<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="NIKOPROSETTEIはVALORANTプロ選手の感度・eDPI・DPI・マウス・マウスパッドなどの設定を検索できるデータベースです。"
  >

  <meta
    name="google-site-verification"
    content="V5oojDNGcRwzI8Rn1DCLUJqRLTM4F4fBTgIdTE9JxsI"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://soki0827.github.io/valorant-pro-settings/"
  >

  <title>
    NIKOPROSETTEI｜VALORANTプロ選手の感度・設定データベース
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- ========================= -->
  <!-- ヘッダー -->
  <!-- ========================= -->

  <header class="header">

    <div class="header-inner">

      <div class="logo">
        VALORANT
        <span>PRO SETTINGS</span>
      </div>

      <p class="subtitle">
        プロ選手の感度・デバイス情報を検索
      </p>

    </div>


    <div class="site-title">

      <h1>NIKOPROSETTEI</h1>

      <p>
        VALORANT プロ設定データベース
      </p>

    </div>

  </header>



  <!-- ========================= -->
  <!-- メイン -->
  <!-- ========================= -->

  <main class="container">


    <!-- ========================= -->
    <!-- 検索・フィルター -->
    <!-- ========================= -->

    <section class="filter-section">

      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder="選手名・チーム名を検索..."
          autocomplete="off"
        >

      </div>


      <div class="filters">


        <!-- 国籍 -->

        <select id="countryFilter">

          <option value="all">
            すべての国籍
          </option>

          <option value="🇯🇵">
            🇯🇵 日本
          </option>

          <option value="🇰🇷">
            🇰🇷 韓国
          </option>

          <option value="🇨🇦">
            🇨🇦 カナダ
          </option>

          <option value="🇷🇺">
            🇷🇺 ロシア
          </option>

          <option value="🇺🇸">
            🇺🇸 アメリカ
          </option>

          <option value="🇨🇳">
            🇨🇳 中国
          </option>

        </select>


        <!-- 地域 -->

        <select id="regionFilter">

          <option value="all">
            すべての地域
          </option>

          <option value="Pacific">
            Pacific
          </option>

          <option value="Americas">
            Americas
          </option>

          <option value="EMEA">
            EMEA
          </option>

          <option value="China">
            China
          </option>

        </select>


        <!-- ロール -->

        <select id="roleFilter">

          <option value="all">
            すべてのロール
          </option>

          <option value="Duelist">
            Duelist
          </option>

          <option value="Initiator">
            Initiator
          </option>

          <option value="Controller">
            Controller
          </option>

          <option value="Sentinel">
            Sentinel
          </option>

          <option value="Flex">
            Flex
          </option>

          <option value="未登録">
            未登録
          </option>

        </select>


        <!-- eDPI -->

        <select id="edpiFilter">

          <option value="all">
            すべてのeDPI
          </option>

          <option value="low">
            100〜200
          </option>

          <option value="mid">
            200〜300
          </option>

          <option value="high">
            300〜400
          </option>

          <option value="veryhigh">
            400以上
          </option>

        </select>


        <!-- 感度 -->

        <select id="sensFilter">

          <option value="all">
            すべての感度
          </option>

          <option value="low">
            0.10〜0.20
          </option>

          <option value="mid">
            0.20〜0.30
          </option>

          <option value="high">
            0.30〜0.40
          </option>

          <option value="veryhigh">
            0.40以上
          </option>

        </select>


      </div>

    </section>



    <!-- ========================= -->
    <!-- プロ選手一覧 -->
    <!-- ========================= -->

    <section id="playerSection">


      <div class="list-header">

        <div>

          <h2>
            VALORANT プロ選手一覧
          </h2>

          <p>
            VALORANTプロ選手の感度・eDPI・デバイス設定をチェック
          </p>

        </div>


        <div
          id="resultCount"
          class="result-count"
        >
          0人
        </div>

      </div>


      <div
        id="playerList"
        class="player-list"
      ></div>


    </section>



    <!-- ========================= -->
    <!-- 選手詳細 -->
    <!-- ========================= -->

    <section
      id="playerDetail"
      class="player-detail hidden"
    ></section>



    <!-- ========================= -->
    <!-- eDPI計算機 -->
    <!-- ========================= -->

    <section class="calculator">

      <h2>
        eDPI Calculator
      </h2>

      <p>
        DPIとVALORANTのゲーム内感度からeDPIを計算できます。
      </p>


      <div class="calculator-inputs">

        <input
          type="number"
          id="dpiInput"
          placeholder="DPI"
          min="1"
        >

        <span>×</span>

        <input
          type="number"
          id="sensInput"
          placeholder="感度"
          step="0.001"
          min="0"
        >

        <button
          type="button"
          onclick="calculateEDPI()"
        >
          計算
        </button>

      </div>


      <div class="calculator-result">

        <span>
          eDPI
        </span>

        <strong id="edpiResult">
          0.0
        </strong>

      </div>

    </section>


  </main>



  <!-- ========================= -->
  <!-- フッター -->
  <!-- ========================= -->

  <footer class="footer">

    <p>
      NIKOPROSETTEI
    </p>

    <p>
      VALORANT PRO SETTINGS DATABASE
    </p>


    <div class="footer-links">

      <a href="contact.html">
        お問い合わせ
      </a>

      <a href="privacy.html">
        プライバシーポリシー
      </a>

    </div>


    <p class="copyright">
      © 2026 NIKOPROSETTEI
    </p>

  </footer>



  <!-- ========================= -->
  <!-- JavaScript -->
  <!-- ========================= -->

  <script src="script.js"></script>


</body>

</html>
